name: pages
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: [master]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: fetch courts (키 없으면 sample)
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: python fetch_courts.py
      - name: build site (courts.json 은 커밋하지 않고 산출물로만)
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/courts.json _site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
