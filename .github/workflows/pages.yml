name: pages
# 예약 실행(스케줄) 없음: 아무도 안 보는 동안 서울·용인을 받지 않는다. 서울은 화면이 /api/seoul(Vercel)에서, 용인은 /api/arpia 에서 열 때 가져온다.
# 이 워크플로는 GitHub Pages(이동 안내 페이지 + 마지막 저장본 data/*.json)를 올릴 때만 수동(또는 master 푸시)으로 돈다.
on:
  workflow_dispatch:
  push:
    branches: [master]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: build site (수집 없음 — 저장소에 보관한 마지막 저장본만 올림)
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/courts.json _site/data/courts.json
          cp data/yongin-saved.json _site/data/yongin.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: 아티팩트 목록 반영 대기 (deploy-pages 가 'artifact 0개'로 실패하는 지연 회피)
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
