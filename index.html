<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 모임 코트판 — 주소가 옮겨졌습니다</title>
<meta http-equiv="refresh" content="3;url=https://club-court-board.vercel.app/">
<link rel="canonical" href="https://club-court-board.vercel.app/">
<style>
:root{--court:#17533D;--ball:#D9EA4F;--bg:#F4F2EC;--ink:#1B1F1C;--sub:#5B625D}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans KR',system-ui,-apple-system,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
.box{max-width:440px;width:100%;background:#fff;border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 1px 2px rgba(27,31,28,.06);border-top:6px solid var(--ball)}
h1{margin:0;font-size:20px;line-height:1.4}
p{margin:0;color:var(--sub)}
a.go{min-height:48px;border-radius:14px;background:var(--court);color:#fff;font-size:15px;font-weight:600;text-decoration:none;display:flex;align-items:center;justify-content:center}
a.go:focus-visible{outline:3px solid #2F7FD8;outline-offset:2px}
</style>
</head>
<body>
<main class="box">
  <h1>우리 모임 코트판 주소가 옮겨졌습니다</h1>
  <p>새 주소로 3초 뒤 자동으로 이동합니다. 이동하지 않으면 아래 버튼을 눌러 주세요. 즐겨찾기도 새 주소로 바꿔 주세요.</p>
  <a class="go" id="go" href="https://club-court-board.vercel.app/">새 주소로 이동 (club-court-board.vercel.app)</a>
  <p>이 주소는 수집 데이터(data/*.json)를 보관하는 용도로 계속 쓰입니다.</p>
</main>
<script>
(function(){var u='https://club-court-board.vercel.app/'+(location.hash||'');document.getElementById('go').href=u;setTimeout(function(){location.replace(u)},1500)})();
</script>
</body>
</html>
